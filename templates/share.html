<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta property="og:title" content="{{ name }}" />
  <meta property="og:description" content="Shared via mwvr" />
  <meta property="og:type" content="video.other" />
  <meta property="og:url" content="{{ page_url }}" />
  <meta property="og:image" content="{{ thumbnail_url }}" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:video" content="{{ page_url }}/stream" />
  <meta property="og:video:type" content="{{ mime }}" />
  <meta property="og:video:secure_url" content="{{ page_url }}/stream" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ name }}" />
  <meta name="twitter:image" content="{{ thumbnail_url }}" />
  <title>{{ name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
  {% include "theme_head.html" %}
  {{ analytics_tag|safe }}
</head>
<body class="page-share">
  <main>
    <h1>{{ name }}</h1>
    <video controls playsinline preload="metadata">
      <source src="/share/{{ uuid }}/stream" type="video/{{ extension }}">
    </video>
    <div class="share-actions">
      <div class="download-wrap">
        <a class="download-btn" href="/share/{{ uuid }}/download" download="{{ name }}">download</a>
        <button class="download-btn download-caret" id="share-download-caret" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-label="download options">&#9662;</button>
        <ul class="download-menu" id="share-download-menu" role="menu" hidden>
          <li><a href="/share/{{ uuid }}/download" download="{{ name }}">download original</a></li>
          <li{% if extension != "webm" %} hidden{% endif %}>
            <a href="/share/{{ uuid }}/download?format=mp4" download="{{ mp4_name }}">convert to mp4</a>
          </li>
        </ul>
      </div>
    </div>
    <p>shared via mwvr</p>
  </main>
  {% include "theme_select.html" %}
  {% include "theme.js" %}

  <script>
    (() => {
      const caret = document.getElementById('share-download-caret');
      const menu = document.getElementById('share-download-menu');
      const close = () => {
        menu.hidden = true;
        caret.setAttribute('aria-expanded', 'false');
      };
      caret.addEventListener('click', e => {
        e.stopPropagation();
        const willOpen = menu.hidden;
        menu.hidden = !willOpen;
        caret.setAttribute('aria-expanded', willOpen);
      });
      document.addEventListener('click', e => {
        if (!menu.hidden && !e.target.closest('.download-wrap')) close();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !menu.hidden) close();
      });
      menu.addEventListener('click', close);
    })();
  </script>
</body>
</html>
