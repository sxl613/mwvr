<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>{{ name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
  <style>
    :root {
      --bg: #111;
      --bg-video: #0a0a0a;
      --color: #aaa;
      --color-h1: #ccc;
      --color-muted: #555;
      --border: #222;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f5;
        --bg-video: #e0e0e0;
        --color: #555;
        --color-h1: #222;
        --color-muted: #999;
        --border: #ddd;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "SF Mono", "Cascadia Mono", "Consolas", monospace;
      background: var(--bg);
      color: var(--color);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 900px;
    }
    h1 {
      color: var(--color-h1);
      font-size: 0.85rem;
      font-weight: normal;
      margin-bottom: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    video {
      width: 100%;
      max-height: calc(100dvh - 6rem);
      background: var(--bg-video);
      border: 1px solid var(--border);
      display: block;
    }
    p {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--color-muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ name }}</h1>
    <video controls playsinline preload="metadata">
      <source src="/share/{{ uuid }}/stream" type="video/{{ extension }}">
    </video>
    <p>shared via mwvr</p>
  </main>
</body>
</html>
