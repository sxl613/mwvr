<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
    <title>mwvr / shares</title>
    {% include "theme_head.html" %}
    {{ analytics_tag|safe }}
</head>
<body class="page-shares">
    <div class="container">
        <h1 class="site-head">
            <span><a href="/">mwvr</a> / shares</span>
            {% include "theme_select.html" %}
        </h1>
        <a class="back-link" href="/">&larr; list</a>
        <div id="share-list"></div>
    </div>
    <script id="shares-data" type="application/json">{{ shares_json|safe }}</script>
    <script>
        (() => {
            const shares = JSON.parse(document.getElementById('shares-data').textContent);
            const list = document.getElementById('share-list');

            function fmt(secs) {
                if (!secs) return 'never';
                const d = new Date(secs * 1000);
                return d.toLocaleString();
            }

            if (!shares.length) {
                const p = document.createElement('p');
                p.textContent = 'no shares yet.';
                list.appendChild(p);
                return;
            }

            shares.forEach(s => {
                const row = document.createElement('div');
                row.className = 'share-row';

                const name = document.createElement('span');
                name.className = 'share-name';
                name.textContent = s.name;
                name.title = s.name;

                const url = document.createElement('code');
                url.className = 'share-url';
                url.textContent = s.url;
                url.title = s.url;

                const meta = document.createElement('span');
                meta.className = 'share-meta';
                const updateMeta = () => {
                    const viewLimit = s.max_views == null ? `${s.view_count} views` : `${s.view_count} / ${s.max_views} views`;
                    const expiry = s.expires_at ? 'expires ' + fmt(s.expires_at) : 'never expires';
                    meta.textContent = `${viewLimit} · ${expiry}`;
                };
                updateMeta();

                const regenerate = document.createElement('button');
                regenerate.textContent = 'regenerate';
                regenerate.title = 'Create a new link and invalidate this one';
                regenerate.addEventListener('click', async () => {
                    if (!window.confirm('Create a new link for this file and invalidate the current link?')) return;
                    try {
                        const response = await fetch('/api/shares/' + s.uuid + '/regenerate', { method: 'POST' });
                        if (!response.ok) throw new Error(await response.text());
                        Object.assign(s, await response.json());
                        url.textContent = s.url;
                        url.title = s.url;
                        updateMeta();
                        regenerate.textContent = 'regenerated';
                        setTimeout(() => { regenerate.textContent = 'regenerate'; }, 1500);
                    } catch (_) {
                        regenerate.textContent = 'failed';
                    }
                });

                const copy = document.createElement('button');
                copy.textContent = 'copy';
                copy.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(s.url);
                        copy.textContent = 'copied';
                        setTimeout(() => { copy.textContent = 'copy'; }, 1500);
                    } catch (e) {
                        copy.textContent = 'copy failed';
                    }
                });

                const revoke = document.createElement('button');
                revoke.textContent = 'revoke';
                revoke.className = 'revoke';
                revoke.addEventListener('click', async () => {
                    try {
                        const res = await fetch('/api/shares/' + s.uuid, { method: 'DELETE' });
                        if (!res.ok) throw new Error(res.status);
                        row.remove();
                        if (!list.children.length) {
                            const p = document.createElement('p');
                            p.textContent = 'no shares yet.';
                            list.appendChild(p);
                        }
                    } catch (e) {
                        revoke.textContent = 'failed';
                    }
                });

                row.append(name, url, meta, regenerate, copy, revoke);
                list.appendChild(row);
            });
        })();
    </script>
{% include "theme.js" %}
</body>
</html>
